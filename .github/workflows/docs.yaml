name: Deploy Docs

on:
  push:
    branches:
      - master
  workflow_call:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install -r requirements-dev.txt --system

      - name: Deploy to GitHub
        run: mkdocs gh-deploy --force
