name: Tag New Version and Release

on:
  push:
    branches:
      - m
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  tag-and-release:
    uses: George-Ogden/actions/.github/workflows/python-release.yaml@v5.1.2
    with:
      validation-code: "from extra_types.types import Nat; from extra_types.type_utils import strict_cast; strict_cast(Nat, 0)"
      python-version: "3.14"
